
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: gradle --no-daemon -p app assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rosgvardiya-Reference-APK
          path: app/build/outputs/apk/debug/*.apk
